plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.0.0'
group = 'com.truedarkness'

base {
    archivesName = 'truedarkness'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = '21.1.172'

    parchment {
        mappingsVersion = '2024.11.17'
        minecraftVersion = '1.21.1'
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', 'truedarkness'
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        truedarkness {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // NeoForge is added automatically via neoForge block
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
